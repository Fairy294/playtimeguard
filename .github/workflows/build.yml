name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 打 tag 发布时，先确认 tag 和 gradle.properties 里的 mod_version 对得上，
      # 避免出现「tag 是 v1.2.0、jar 里写的却是 1.1.0」这种对不上的情况。
      - name: Verify tag matches mod_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION="$(grep -E '^mod_version=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          echo "tag 版本    : $TAG_VERSION"
          echo "mod_version : $MOD_VERSION"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 gradle.properties 里的 mod_version=$MOD_VERSION 不一致"
            exit 1
          fi
          echo "版本一致，继续构建"

      - name: Show versions
        run: |
          java -version
          ./gradlew --version

      - name: Build
        run: ./gradlew build --console=plain --stacktrace

      - name: List build output
        run: ls -lh build/libs/

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: playtimeguard-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
